name: Graph solver regression
on:
  push:
    paths:
      - 'src/main/java/org/gtlcore/gtlcore/integration/ae2/graph/core/**'
      - 'tools/graph-regression/**'
      - '.github/workflows/graph-regression.yml'
  pull_request:
    paths:
      - 'src/main/java/org/gtlcore/gtlcore/integration/ae2/graph/core/**'
      - 'tools/graph-regression/**'
      - '.github/workflows/graph-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Keep the cumulative 20M work cap; shared-runner latency is not a proof budget.
      - run: python tools/graph-regression/run.py --milliseconds 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-regression-results
          path: build/graph-regression/*.log
